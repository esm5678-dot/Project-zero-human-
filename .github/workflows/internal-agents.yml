name: ZERO HUMAN internal agent execution
on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  internal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run allowlisted internal jobs
        env:
          ZERO_HUMAN_OUTPUT: artifacts/agent-run.json
        run: python3 scripts/run_agents.py
      - name: Upload run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zero-human-agent-run
          path: artifacts/agent-run.json
          retention-days: 7
