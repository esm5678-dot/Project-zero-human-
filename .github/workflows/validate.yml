name: Zero-cost validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify project structure and CSV schema
        run: |
          python3 - <<'PY'
          import csv, pathlib
          required=['PROJECT_CHARTER.md','agents/ROLES.md','data/experiment_log.csv']
          for p in required:
              assert pathlib.Path(p).is_file(), p
          with open('data/experiment_log.csv',newline='') as f:
              header=next(csv.reader(f))
          assert header == ['task_id','date','agent','action','status','evidence','human_minutes','new_spend_krw','approval_status']
          print('Validation passed')
          PY

      - name: Check offline MVP and JavaScript syntax
        run: python3 tests/check_mvp.py

      - name: Install free browser test tooling
        run: |
          npm ci
          npx playwright install chromium

      - name: Test MVP in Chromium
        run: npm run test:browser

      - name: Test zero-spend model safety gate and local runner preflight
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 scripts/model_gate.py config/model_policy.json

      - name: Check guided demo syntax and offline policy
        run: python3 tests/check_demo.py
